name: Open Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Review pull request
    runs-on: ubuntu-latest
    # Do not expose the Gemini key to pull requests from forks.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Open Code Review
        run: npm install --global @alibaba-group/open-code-review

      - name: Run Open Code Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ocr config provider gemini
          ocr config model gemini-1.5-pro
          ocr review --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --platform github
